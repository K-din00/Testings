<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Login — Apex</title>
<meta name="description" content="Restricted access to the Apex internal operations console.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">
</head>
<body class="auth-page">

<div class="grain"></div>

<header class="nav auth-nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      APEX
    </a>
    <span class="internal-tag mono">Internal</span>
  </div>
</header>

<main class="auth-main">
  <section class="login-card" aria-labelledby="loginTitle">
    <div class="login-head">
      <p class="eyebrow">Restricted access</p>
      <h1 id="loginTitle">Internal login</h1>
      <p>Sign in to the Apex operations console.</p>
    </div>

    <form id="loginForm" novalidate>
      <noscript><p class="noscript-note">JavaScript is required to sign in.</p></noscript>

      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          autofocus
          required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required>
          <button
            type="button"
            class="pw-toggle"
            id="pwToggle"
            aria-label="Show password"
            aria-controls="password"
            aria-pressed="false"
            title="Show password">
            <svg class="pw-icon pw-icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 3l18 18"/>
              <path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6 0 9.5 7 9.5 7a18 18 0 0 1-3.2 4.2"/>
              <path d="M6.5 6.6C4 8.4 2.5 12 2.5 12S6 19 12 19a10 10 0 0 0 4.5-1.1"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
            <svg class="pw-icon pw-icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="form-error" id="loginError" role="alert" aria-live="polite"></p>

      <button type="submit" class="btn btn-primary login-submit" id="loginSubmit">Sign in</button>
    </form>

    <div class="login-foot">
      <span class="login-secure"><span class="status-dot" aria-hidden="true"></span>Authorized personnel only</span>
      <a href="index.html">← Back to site</a>
    </div>
  </section>
</main>

<script src="auth.js"></script>
</body>
</html>
